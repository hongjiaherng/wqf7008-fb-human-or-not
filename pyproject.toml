[project]
name = "wqf7008-fb-human-or-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "hongjiaherng", email = "jiaherng2001@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "seaborn>=0.13.2",
    # MacOS specific: MPS acceleration
    "torch; sys_platform == 'darwin'",
    "torchvision; sys_platform == 'darwin'",
    "torchaudio; sys_platform == 'darwin'",
    # Windows/Linux specific: CUDA builds
    "torch; sys_platform == 'win32' or sys_platform == 'linux'",
    "torchvision; sys_platform == 'win32' or sys_platform == 'linux'",
    "torchaudio; sys_platform == 'win32' or sys_platform == 'linux'",
    "scikit-learn>=1.8.0",
    "tensorboard>=2.20.0",
]

[project.scripts]
wqf7008-fb-human-or-bot = "wqf7008_fb_human_or_bot:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.uv.sources]
# Route torch packages to CUDA index only on Windows/Linux
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
